<!doctype html><html><head><meta charset="utf-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PhoneDrop</title>
<style>
:root{--blue:#4285f4;--ink:#eeeeee;--mute:#9a9aa2;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0 auto;max-width:640px;min-height:100vh;font:16px -apple-system,"SF Pro Text",system-ui;color:var(--ink);text-align:center;
  background:#000;padding:env(safe-area-inset-top) 20px 40px}
h1{font-size:17px;margin:22px 0 0}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
#stage{position:relative;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.rings{position:absolute;left:50%;top:50%;width:0;height:0}
.rings i{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.16);
  transform:translate(-50%,-50%);animation:pulse 4s ease-out infinite}
.rings i:nth-child(2){animation-delay:1.33s}.rings i:nth-child(3){animation-delay:2.66s}
@keyframes pulse{0%{width:110px;height:110px;opacity:.9}100%{width:520px;height:520px;opacity:0}}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.bubble{width:96px;height:96px;border-radius:50%;background:#16181d;display:grid;place-items:center;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.18)}
.bubble svg{width:44px;height:44px;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pc:active .bubble{transform:scale(.95)}
.pc b{margin-top:12px}
.pc small{color:var(--mute)}
#off{color:var(--mute);display:none}
@media (min-width:700px){#stage{height:380px}.bubble{width:120px;height:120px}.bubble svg{width:54px;height:54px}body{font-size:18px}}
input{display:none}
h2{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;text-align:left;margin:22px 4px 6px}
.row{background:#16181d;border-radius:10px;padding:12px 14px;margin:8px 0;text-align:left;font-size:15px;
  box-shadow:none;word-break:break-all}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue)}
.done .bar i{background:#2fb344}
a.dl{display:flex;align-items:center;gap:12px;color:var(--blue);text-decoration:none;font-weight:600}
.th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#2a2d35;flex:none}
.top{display:flex;align-items:center;gap:12px}
.top>div{min-width:0;flex:1}
</style></head><body>
<h1>PhoneDrop</h1><div class="sub">Nearby</div>
<div id="stage">
  <div class="rings"><i></i><i></i><i></i></div>
  <label class="pc" id="pc">
    <div class="bubble"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div>
    <b id="pcname">Your PC</b><small>Tap to send files</small>
    <input id="f" type="file" multiple>
  </label>
  <div id="off">Looking for your PC…</div>
</div>
<div id="uph" style="display:none"><h2>Sending</h2></div>
<div id="list"></div>
<h2 id="fromh" style="display:none">From your PC</h2>
<div id="from"></div>
<script>
const $=id=>document.getElementById(id);
// iPadOS Safari pretends to be a Mac, so look for touch support too
const ua=navigator.userAgent;
const kind=/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)?'ipad':/iPhone/.test(ua)?'iphone':'';
let me;
try{me=localStorage.getItem('pd-id');if(!me){me=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('pd-id',me)}}
catch{me=Math.random().toString(36).slice(2)}
const mb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';
let last='';
async function poll(){
  try{
    const t=await (await fetch('/files?d='+me+'&k='+kind,{cache:'no-store'})).text();
    $('pc').style.display='flex';$('off').style.display='none';
    if(t!==last){last=t;const {pc,files}=JSON.parse(t);
      $('pcname').textContent=pc;
      $('fromh').style.display=files.length?'block':'none';
      const box=$('from');box.innerHTML='';
      for(const f of files){const a=document.createElement('a');a.className='row dl';
        a.href='/download/'+f.id;
        const im=document.createElement('img');im.className='th';im.src='/preview/'+f.id;im.onerror=()=>im.remove();
        const t=document.createElement('span');t.textContent=f.name+' · '+mb(f.size);a.append(im,t);box.append(a)}}
  }catch{$('pc').style.display='none';$('off').style.display='block'}
  setTimeout(poll,2000);
}
poll();
$('f').onchange=async e=>{
  const list=$('list');$('uph').style.display='block';
  for(const file of [...e.target.files]){
    const row=document.createElement('div');row.className='row';
    row.innerHTML='<div class="top"><img class="th"><div></div></div><div class="bar"><i></i></div>';
    const nm=row.querySelector('.top>div');nm.textContent=file.name;
    const th=row.querySelector('.th');
    if(file.type.startsWith('image/')){th.src=URL.createObjectURL(file);th.onload=()=>URL.revokeObjectURL(th.src);th.onerror=()=>th.remove()}else th.remove();
    list.prepend(row);
    await new Promise(done=>{
      const x=new XMLHttpRequest();x.open('PUT','/upload');
      x.setRequestHeader('x-filename',encodeURIComponent(file.name));
      x.upload.onprogress=p=>row.querySelector('i').style.width=(p.loaded/p.total*100)+'%';
      x.onload=()=>{row.classList.add('done');row.querySelector('i').style.width='100%';
        nm.textContent='✓ '+file.name;done()};
      x.onerror=()=>{nm.textContent='✗ Failed: '+file.name;done()};
      x.send(file);
    });
  }
  e.target.value='';
};
</script></body></html>
