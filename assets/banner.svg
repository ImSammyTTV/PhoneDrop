<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="PhoneDrop: send files between your iPhone and PC over Wi-Fi">
  <defs>
    <radialGradient id="glow" cx="50%" cy="100%" r="80%">
      <stop offset="0" stop-color="#4285f4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4285f4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ec0ff"/>
    </linearGradient>
    <style>
      .ring{fill:none;stroke:#fff;stroke-width:1.2;stroke-opacity:.09}
      .wave{fill:none;stroke:#4285f4;stroke-width:1.6;transform-origin:640px 420px;animation:wave 6s cubic-bezier(.2,.5,.4,1) infinite;opacity:0}
      .w2{animation-delay:-2s}.w3{animation-delay:-4s}
      @keyframes wave{0%{transform:scale(.03);opacity:.9}100%{transform:scale(1);opacity:0}}
      .bubble{fill:#16181d;stroke:#fff;stroke-opacity:.18;stroke-width:1.5}
      .ico{fill:none;stroke:#4285f4;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .arrow{fill:none;stroke:#4285f4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 9;animation:dash 1.4s linear infinite}
      .head{fill:none;stroke:#4285f4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .arrow.back{animation-direction:reverse}
      @keyframes dash{to{stroke-dashoffset:-30}}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      @media (prefers-reduced-motion:reduce){.wave,.arrow{animation:none}}
    </style>
  </defs>

  <rect width="1280" height="360" fill="#000"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <g>
    <circle class="ring" cx="640" cy="420" r="170"/>
    <circle class="ring" cx="640" cy="420" r="340"/>
    <circle class="ring" cx="640" cy="420" r="510"/>
    <circle class="ring" cx="640" cy="420" r="680"/>
    <circle class="ring" cx="640" cy="420" r="850"/>
    <circle class="wave" cx="640" cy="420" r="900"/>
    <circle class="wave w2" cx="640" cy="420" r="900"/>
    <circle class="wave w3" cx="640" cy="420" r="900"/>
  </g>

  <!-- PC bubble -->
  <g transform="translate(250 150)">
    <circle class="bubble" r="52"/>
    <g transform="translate(-24 -24) scale(2)">
      <rect class="ico" x="3" y="4" width="18" height="12" rx="2" transform="scale(1)" style="stroke-width:1.3"/>
      <path class="ico" d="M8 20h8M12 16v4" style="stroke-width:1.3"/>
    </g>
  </g>

  <!-- phone bubble -->
  <g transform="translate(1030 150)">
    <circle class="bubble" r="52"/>
    <g transform="translate(-24 -24) scale(2)">
      <rect class="ico" x="7" y="2.5" width="10" height="19" rx="2.5" style="stroke-width:1.3"/>
      <path class="ico" d="M11 18.5h2" style="stroke-width:1.3"/>
    </g>
  </g>

  <!-- transfer arrows -->
  <path class="arrow" d="M330 150H430"/>
  <path class="head" d="M424 141l9 9-9 9"/>
  <path class="arrow back" d="M950 150H850"/>
  <path class="head" d="M856 141l-9 9 9 9"/>

  <text x="640" y="196" text-anchor="middle" font-size="64" font-weight="700" letter-spacing="-1.5" fill="url(#title)">PhoneDrop</text>
  <text x="640" y="238" text-anchor="middle" font-size="21" fill="#9a9aa2">Send files between your iPhone, iPad and PC over Wi-Fi</text>

  <g transform="translate(640 292)" font-size="14" font-weight="600">
    <rect x="-168" y="-16" width="108" height="30" rx="15" fill="#4285f4" fill-opacity=".16" stroke="#4285f4" stroke-opacity=".5"/>
    <text x="-114" y="5" text-anchor="middle" fill="#8ab4ff">No iPhone app</text>
    <rect x="-48" y="-16" width="96" height="30" rx="15" fill="#4285f4" fill-opacity=".16" stroke="#4285f4" stroke-opacity=".5"/>
    <text x="0" y="5" text-anchor="middle" fill="#8ab4ff">No cloud</text>
    <rect x="60" y="-16" width="108" height="30" rx="15" fill="#4285f4" fill-opacity=".16" stroke="#4285f4" stroke-opacity=".5"/>
    <text x="114" y="5" text-anchor="middle" fill="#8ab4ff">No sign-up</text>
  </g>
</svg>
